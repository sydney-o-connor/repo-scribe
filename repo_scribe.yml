name: repo-scribe

on:
  pull_request:
    paths:
      - "**/*.kt"
      - "**/*.kts"

# Needed if you add the "commit the updated README" step below.
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # If you publish this to the Marketplace, replace the next line with:
      #   uses: your-org/repo-scribe@v1
      - uses: ./ # use the local action.yml for now
        id: scribe
        with:
          repo-root: "."
          readme-path: "README.md"

      # Optional: commit the regenerated README section back to the PR branch.
      # Remove this step if you'd rather just review the diff and commit manually.
      - name: Commit README updates
        run: |
          if ! git diff --quiet -- README.md; then
            git config user.name "repo-scribe-bot"
            git config user.email "actions@users.noreply.github.com"
            git add README.md
            git commit -m "docs: update repo-scribe generated section"
            git push
          fi